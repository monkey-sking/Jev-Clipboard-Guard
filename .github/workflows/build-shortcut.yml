name: Build Jev Clipboard Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-shortcut-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check source contract
        run: python3 scripts/check_source.py

      - name: Test local share-code rules
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Fetch pinned Cherri compiler
        env:
          CHERRI_COMMIT: bcc0095754e2cc0baaeb4d93dae172b8153b4716
        run: |
          git clone --filter=blob:none https://github.com/electrikmilk/cherri.git "$RUNNER_TEMP/cherri"
          git -C "$RUNNER_TEMP/cherri" checkout --detach "$CHERRI_COMMIT"
          printf 'Pinned Cherri commit: '
          git -C "$RUNNER_TEMP/cherri" rev-parse HEAD

      - name: Build Cherri compiler
        run: |
          cd "$RUNNER_TEMP/cherri"
          go build -o "$RUNNER_TEMP/cherri-bin" .
          "$RUNNER_TEMP/cherri-bin" --version

      # This job deliberately stops at the UNSIGNED artifact.
      #
      # Shortcuts refuses to import an unsigned plist, and only Apple can sign
      # one: `shortcuts sign` requires a Mac logged into the maintainer's iCloud
      # (so it cannot run on a hosted runner), and the third-party RoutineHub
      # HubSign endpoint now answers with an HTML redirect instead of an AEA1
      # payload. Shipping a job that can never succeed just meant every push to
      # main was red. Sign locally with scripts/sign_on_mac.command instead.
      - name: Compile unsigned artifact
        run: |
          mkdir -p dist
          "$RUNNER_TEMP/cherri-bin" Jev_Clipboard_Guard.cherri --skip-sign --derive-uuids
          ls -lah *.shortcut
          # Cherri names its output after `#define name` in the source.
          UNSIGNED=$(ls *_unsigned.shortcut)
          cp "$UNSIGNED" dist/Jev_Clipboard_Guard_unsigned.plist
          rm -f "$UNSIGNED"
          python3 -c "
          import plistlib, sys
          wf = plistlib.load(open('dist/Jev_Clipboard_Guard_unsigned.plist','rb'))
          actions = wf['WFWorkflowActions']
          print(f'compiled actions: {len(actions)}')
          sys.exit('unexpectedly small workflow - Cherri action definitions probably failed to expand') if len(actions) < 100 else None
          "

      - name: Upload unsigned compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jev-Clipboard-Guard-unsigned-plist
          path: dist/Jev_Clipboard_Guard_unsigned.plist
          if-no-files-found: error
          retention-days: 14